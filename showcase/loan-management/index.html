<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lamba Enterprises — Offline Professional Loan Management System with direct Excel synchronization.">
  <title>Lamba Enterprises — Loan Management System</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- Gold Badge Icon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23f59e0b'/><text x='50' y='72' font-size='60' font-weight='900' text-anchor='middle' fill='%230f172a'>L</text></svg>">
</head>
<body>
  <div class="app">

    <!-- ═══════ Left Sidebar Navigation ═══════ -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">LE</div>
        <div class="sidebar-brand">
          <h1>Lamba Enterprises</h1>
          <span>Loan Management</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" data-page="dashboard">
          <span class="nav-icon">📊</span>
          <span>Dashboard</span>
        </button>
        <button class="nav-item" data-page="borrowers">
          <span class="nav-icon">👥</span>
          <span>Borrowers</span>
        </button>
        <button class="nav-item" data-page="payments">
          <span class="nav-icon">💰</span>
          <span>Quick Collect</span>
        </button>
        <button class="nav-item" data-page="settings">
          <span class="nav-icon">⚙️</span>
          <span>Settings & Data</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="data-status">
          <div class="data-status-dot loaded"></div>
          <span class="data-status-text">Ready · Offline Mode</span>
        </div>
      </div>
    </aside>

    <!-- ═══════ Main App Window ═══════ -->
    <main class="main-content">
      <!-- Top Bar Header -->
      <header class="top-bar">
        <div id="top-bar-content" style="display:flex; justify-content:space-between; align-items:center; width:100%;">
          <div class="top-bar-left">
            <h2 class="page-title">Dashboard Overview</h2>
            <span class="breadcrumb">Lamba Enterprises</span>
          </div>
          <div class="top-bar-actions">
            <div id="live-sync-indicator" class="sync-badge sync-offline">
              <span class="pulse-dot-gray"></span> Offline Storage Active
            </div>
          </div>
        </div>
      </header>

      <!-- Dynamic Page Container -->
      <div class="page-container" id="page-container">
        <!-- Rendered by App Router -->
      </div>
    </main>

  </div>

  <!-- Dynamic Modal & Lightbox Container -->
  <div id="modal-container"></div>

  <!-- Toast Notification Deck -->
  <div id="toast-container"></div>

  <!-- Hidden Native File Inputs -->
  <input type="file" id="excel-file-input" accept=".xlsx,.xls" style="display:none">
  <input type="file" id="backup-file-input" accept=".zip" style="display:none">

  <!-- Bundled Offline Libraries -->
  <script src="libs/xlsx.full.min.js"></script>
  <script src="libs/jszip.min.js"></script>

  <!-- Core Application Scripts -->
  <script src="js/default-data.js"></script>
  <script src="js/loan-calculator.js"></script>
  <script src="js/image-handler.js"></script>
  <script src="js/excel-handler.js"></script>
  <script src="js/ui-components.js"></script>
  <script src="js/export-handler.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
